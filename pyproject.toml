[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tensorflow-riemopt"
version = "0.3.1"
description = "a library for optimization on Riemannian manifolds"
readme = "README.md"
authors = [{ name = "Oleg Smirnov", email = "oleg.smirnov@gmail.com" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = ["tensorflow"]
keywords = ["tensorflow", "optimization", "machine learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Operating System :: OS Independent",
]

[project.urls]
Documentation = "https://tensorflow-riemopt.readthedocs.io/en/latest/"
Source = "https://github.com/master/tensorflow-riemopt"

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-cov",
    "coveralls",
    "sphinx",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
]

[tool.hatch.build.targets.wheel]
packages = ["tensorflow_riemopt"]

[tool.hatch.build.targets.sdist]
include = ["/tensorflow_riemopt", "/README.md", "/LICENSE", "/pyproject.toml"]

[tool.black]
line-length = 80
